    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {

      padding: 20px 10px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      position: relative;
    }

    /* Dark overlay so the game interface stays clearly readable over the space background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 9, 7, 0.75);
      z-index: -2;
      pointer-events: none;
    }

    /* Floating Background Items (Cats & Tokens) */
    .bg-floating-item {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(0, 255, 102, 0.4);
      object-fit: cover;
      opacity: 0.18;
      pointer-events: none;
      animation: floatBackground linear infinite;
      z-index: -1;
    }

    @keyframes floatBackground {
      0% {
        transform: translateY(105vh) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.22;
      }
      90% {
        opacity: 0.22;
      }
      100% {
        transform: translateY(-10vh) rotate(360deg);
        opacity: 0;
      }

      font-size: 2.8rem;
      margin: 5px 0 15px 0;
      text-shadow: 0 0 10px #00FF66;
      letter-spacing: 2px;
      z-index: 10;
      text-align: center;

      align-items: center;
      width: 100%;

    .score-display {

      color: #ffffff;

    .cps-display {

      color: #A0FFA0;
      margin-top: 3px;

    .clicker-container {

      margin: 15px 0;
    }

    .click-target {

      height: 180px;
      border-radius: 50%;
      border: 4px solid #00FF66;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.5);
      cursor: pointer;
      transition: transform 0.05s ease-in-out;
      object-fit: cover;
    }

    .click-target:active {
      transform: scale(0.92);
    }

    .float-text {
      position: absolute;
      color: #00FF66;
      font-weight: bold;
      font-size: 1.8rem;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      text-shadow: 0 0 6px #000;
      z-index: 20;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-80px) scale(1.3);

    .button-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 10px;
    }

    .admin-btn, .global-chat-btn {

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, collection, query, orderBy, limit, onSnapshot, addDoc, serverTimestamp, getDocs, writeBatch, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCIwhMDn05S_eKskKkjdSJzuDZhlFCdQeE",
      authDomain: "e-clicker-f55e6.firebaseapp.com",
      projectId: "e-clicker-f55e6",
      storageBucket: "e-clicker-f55e6.appspot.com",
      messagingSenderId: "208775071978",
      appId: "1:208775071978:web:c00fd6fff6b2b16b532f93"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let playerId = localStorage.getItem('e_clicker_player_id') || 'player_' + Math.random().toString(36).substring(2, 9);
    localStorage.setItem('e_clicker_player_id', playerId);

    const usernameInput = document.getElementById('usernameInput');
    const savedUsername = localStorage.getItem('e_clicker_username');
    const isNameLocked = localStorage.getItem('e_clicker_name_locked');

    if (savedUsername) {
      usernameInput.value = savedUsername;
      checkIfBanned(savedUsername);
    }

    if (isNameLocked === 'true') {
      usernameInput.disabled = true;
    }

    usernameInput.addEventListener('change', () => {
      const newName = usernameInput.value.trim();
      if (newName !== '') {
        localStorage.setItem('e_clicker_username', newName);
        localStorage.setItem('e_clicker_name_locked', 'true');
        usernameInput.disabled = true;
        checkIfBanned(newName);
        saveScoreToCloud();
      }
    });

    function checkIfBanned(username) {
      const banRef = doc(db, "banned_users", username);
      onSnapshot(banRef, (docSnap) => {
        if (docSnap.exists()) {
          document.body.innerHTML = `
            <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; background:#0B0F0C; color:#ff4d4d; text-align:center; padding: 20px;">
              <h1 style="font-size:3rem; text-shadow:0 0 10px #ff4d4d;">YOU ARE BANNED</h1>
              <p style="font-size:1.2rem; color:#fff;">An administrator has banned the username "${username}" from this game.</p>
            </div>
          `;
        }
      });
    }

    window.saveScoreToCloud = async function() {
      const username = usernameInput.value || 'Anonymous';
      try {
        const scoreToSave = window.gameScore === Infinity ? 9.99e99 : Math.floor(window.gameScore);
        await setDoc(doc(db, "leaderboard", playerId), {
          username: username,
          score: scoreToSave,
          updatedAt: new Date()
        }, { merge: true });
      } catch (e) {
        console.error("Error saving score: ", e);
      }
    }

    window.givePointsToUserByName = async function() {
      const targetName = prompt("Enter the exact username of the player you want to give points to:");
      if (!targetName || targetName.trim() === "") return;

      const amountStr = prompt(`How many points do you want to give to "${targetName.trim()}"?`);
      const amount = parseFloat(amountStr);
      if (isNaN(amount)) {
        alert("Please enter a valid number of points.");
        return;
      }

      try {
        const querySnapshot = await getDocs(collection(db, "leaderboard"));
        let found = false;
        const batch = writeBatch(db);

        querySnapshot.forEach((document) => {
          const data = document.data();
          if (data.username && data.username.toLowerCase() === targetName.trim().toLowerCase()) {
            const docRef = doc(db, "leaderboard", document.id);
            const newScore = (data.score || 0) + amount;
            batch.update(docRef, { score: newScore, updatedAt: new Date() });
            found = true;
          }
        });

        if (found) {
          await batch.commit();
          alert(`Successfully added ${amount} points to user "${targetName.trim()}"! 💸`);
        } else {
          alert(`Could not find any user with the name "${targetName.trim()}" on the leaderboard.`);
        }
      } catch (e) {
        console.error("Error giving points to user: ", e);
        alert("Failed to update user's points.");
      }
    }

    window.banUserInCloud = async function(usernameToBan) {
      try {
        await setDoc(doc(db, "banned_users", usernameToBan), {
          bannedAt: new Date()
        });
        alert(`Successfully banned user: ${usernameToBan} 🚫`);
      } catch (e) {
        console.error("Error banning user: ", e);
        alert("Failed to ban user.");
      }
    }

    window.resetAllScoresInCloud = async function() {
      if (confirm("Are you sure you want to reset EVERYONE's points to 0?")) {
        try {
          const querySnapshot = await getDocs(collection(db, "leaderboard"));
          const batch = writeBatch(db);
          querySnapshot.forEach((document) => {
            const docRef = doc(db, "leaderboard", document.id);
            batch.update(docRef, { score: 0 });
          });
          await batch.commit();
          
          window.gameScore = 0;
          updateDisplay();
          saveProgressLocally();

          alert("Everyone's points have been reset to 0! 🔄");
        } catch (e) {
          console.error("Error resetting scores: ", e);
          alert("Failed to reset scores.");
        }
      }
    }

    const qLeaderboard = query(collection(db, "leaderboard"), orderBy("score", "desc"), limit(10));
    onSnapshot(qLeaderboard, (querySnapshot) => {
      const listEl = document.getElementById('leaderboardList');
      listEl.innerHTML = '';
      let rank = 1;
      querySnapshot.forEach((doc) => {
        const data = doc.data();
        const li = document.createElement('li');
        li.className = 'leaderboard-item';
        const displayScore = data.score > 9e98 ? '∞' : data.score;
        li.innerHTML = `<span>#${rank} ${data.username}</span> <strong>${displayScore} E</strong>`;
        listEl.appendChild(li);
        rank++;
      });
    });

    const qChat = query(collection(db, "global_chat"), orderBy("createdAt", "asc"), limit(50));
    onSnapshot(qChat, (querySnapshot) => {
      const chatMessages = document.getElementById('chatMessages');
      chatMessages.innerHTML = '';
      querySnapshot.forEach((doc) => {
        const msg = doc.data();
        const div = document.createElement('div');
        div.className = 'chat-msg';
        div.innerHTML = `<strong>${msg.username}:</strong> ${msg.text}`;
        chatMessages.appendChild(div);
      });
      chatMessages.scrollTop = chatMessages.scrollHeight;
    });

    window.sendChatMessage = async function(text) {
      const username = usernameInput.value || 'Anonymous';
      if (!text.trim()) return;
      try {
        await addDoc(collection(db, "global_chat"), {
          username: username,
          text: text,
          createdAt: serverTimestamp()
        });
      } catch (e) {
        console.error("Error sending message:", e);
      }
    };

    setInterval(() => {
      if (window.saveScoreToCloud) window.saveScoreToCloud();
    }, 5000);
  </script>
</head>

  <!-- Background Floating Items Generator -->
  <script>
    const catImageUrl = "https://instasize.com/api/image/d552497648af7f20626f807e64481fd0c417fa28d6916753eab603d2c64328fc.jpeg";
    const tokenImageUrl = "https://instasize.com/api/image/d552497648af7f20626f807e64481fd0c417fa28d6916753eab603d2c64328fc.jpeg";

    const imagesToFloat = [catImageUrl, tokenImageUrl];
    for (let i = 0; i < 15; i++) {
      const bgItem = document.createElement('img');
      bgItem.src = imagesToFloat[i % imagesToFloat.length];
      bgItem.className = 'bg-floating-item';
      bgItem.style.left = `${Math.random() * 100}vw`;
      bgItem.style.animationDuration = `${Math.random() * 8 + 6}s`;
      bgItem.style.animationDelay = `${Math.random() * 5}s`;
      const size = Math.random() * 40 + 30;
      bgItem.style.width = `${size}px`;
      bgItem.style.height = `${size}px`;
      document.body.appendChild(bgItem);
    }
  </script>
