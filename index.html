<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E Clicker</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0B0F0C;
      color: #00FF66;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 3rem;
      margin: 10px 0;
      text-shadow: 0 0 10px #00FF66;
      letter-spacing: 2px;
    }

    .main-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 450px;
      width: 100%;
    }

    .game-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stats-container {
      text-align: center;
      margin-bottom: 10px;
    }

    .score-display {
      font-size: 2.5rem;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 0 8px #00FF66;
    }

    .cps-display {
      font-size: 1.2rem;
      color: #A0FFA0;
      margin-top: 5px;
    }

    .clicker-container {
      position: relative;
      margin: 15px 0;
    }

    .click-target {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 4px solid #00FF66;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.5);
      cursor: pointer;
      transition: transform 0.05s ease-in-out;
      object-fit: cover;
    }

    .click-target:active {
      transform: scale(0.92);
    }

    .float-text {
      position: absolute;
      color: #00FF66;
      font-weight: bold;
      font-size: 1.8rem;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      text-shadow: 0 0 6px #000;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-80px) scale(1.3);
      }
    }

    /* Button Bar Layout for ADMIN and Global chat */
    .button-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 10px;
    }

    .admin-btn, .global-chat-btn {
      background: #145A32;
      border: 2px solid #00FF66;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
      transition: background 0.2s, transform 0.1s;
    }

    .admin-btn:hover, .global-chat-btn:hover {
      background: #00FF66;
      color: #000000;
    }

    .global-chat-btn {
      text-align: center;
      line-height: 1.2;
    }

    .panel {
      width: 100%;
      background: rgba(0, 255, 102, 0.05);
      border: 1px solid rgba(0, 255, 102, 0.2);
      border-radius: 12px;
      padding: 15px;
      margin-top: 10px;
    }

    .panel-title {
      text-align: center;
      font-size: 1.4rem;
      margin-bottom: 15px;
      border-bottom: 1px solid rgba(0, 255, 102, 0.3);
      padding-bottom: 5px;
    }

    .upgrade-btn {
      width: 100%;
      background: #141E17;
      border: 2px solid #00FF66;
      color: #ffffff;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }

    .upgrade-btn:hover:not(:disabled) {
      background: #00FF66;
      color: #000000;
      font-weight: bold;
    }

    .upgrade-btn:disabled {
      opacity: 0.4;
      border-color: #555555;
      cursor: not-allowed;
    }

    /* Leaderboard Styles */
    .leaderboard-container {
      width: 100%;
      margin-top: 20px;
    }

    .username-input {
      width: 100%;
      padding: 8px;
      background: #141E17;
      border: 1px solid #00FF66;
      color: #fff;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .username-input:disabled {
      opacity: 0.6;
      border-color: #555555;
      cursor: not-allowed;
    }

    .leaderboard-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      background: #141E17;
      margin-bottom: 6px;
      border-radius: 6px;
      border-left: 3px solid #00FF66;
    }

    /* Modals (Admin & Chat) */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .admin-dashboard-box {
      background: linear-gradient(135deg, #051923, #003554);
      border: 3px solid #00FF66;
      border-radius: 16px;
      padding: 30px;
      width: 90%;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.5);
    }

    .admin-dashboard-title {
      font-size: 2rem;
      color: #ffffff;
      margin-bottom: 25px;
      text-shadow: 0 0 10px #00FF66;
    }

    .dashboard-btn {
      width: 100%;
      background: rgba(20, 30, 23, 0.9);
      border: 2px solid #00FF66;
      color: #ffffff;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.2rem;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .dashboard-btn:hover {
      background: #00FF66;
      color: #000000;
    }

    .close-modal-btn {
      background: #ff4d4d;
      border: 2px solid #ff1a1a;
      color: white;
      margin-top: 10px;
    }

    .close-modal-btn:hover {
      background: #ff1a1a;
    }

    /* Chat Modal Specifics */
    .chat-box {
      background: #0B0F0C;
      border: 3px solid #00FF66;
      border-radius: 16px;
      width: 90%;
      max-width: 400px;
      height: 450px;
      display: flex;
      flex-direction: column;
      padding: 15px;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.4);
    }

    .chat-messages {
      flex: 1;
      background: #141E17;
      border: 1px solid rgba(0, 255, 102, 0.3);
      border-radius: 8px;
      padding: 10px;
      overflow-y: auto;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-msg {
      background: rgba(0, 255, 102, 0.1);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.95rem;
      word-break: break-word;
    }

    .chat-msg strong {
      color: #00FF66;
    }

    .chat-input-row {
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      padding: 8px;
      background: #141E17;
      border: 1px solid #00FF66;
      color: #fff;
      border-radius: 6px;
    }

    .chat-send-btn {
      background: #00FF66;
      color: #000;
      border: none;
      padding: 8px 15px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, collection, query, orderBy, limit, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCIwhMDn05S_eKskKkjdSJzuDZhlFCdQeE",
      authDomain: "e-clicker-f55e6.firebaseapp.com",
      projectId: "e-clicker-f55e6",
      storageBucket: "e-clicker-f55e6.appspot.com",
      messagingSenderId: "208775071978",
      appId: "1:208775071978:web:c00fd6fff6b2b16b532f93"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let playerId = localStorage.getItem('e_clicker_player_id') || 'player_' + Math.random().toString(36).substring(2, 9);
    localStorage.setItem('e_clicker_player_id', playerId);

    const usernameInput = document.getElementById('usernameInput');
    const savedUsername = localStorage.getItem('e_clicker_username');
    const isNameLocked = localStorage.getItem('e_clicker_name_locked');

    if (savedUsername) {
      usernameInput.value = savedUsername;
    }

    if (isNameLocked === 'true') {
      usernameInput.disabled = true;
    }

    usernameInput.addEventListener('change', () => {
      const newName = usernameInput.value.trim();
      if (newName !== '') {
        localStorage.setItem('e_clicker_username', newName);
        localStorage.setItem('e_clicker_name_locked', 'true');
        usernameInput.disabled = true;
        saveScoreToCloud();
      }
    });

    window.saveScoreToCloud = async function() {
      const username = usernameInput.value || 'Anonymous';
      try {
        await setDoc(doc(db, "leaderboard", playerId), {
          username: username,
          score: Math.floor(window.gameScore),
          updatedAt: new Date()
        });
      } catch (e) {
        console.error("Error saving score: ", e);
      }
    }

    // Leaderboard listener
    const qLeaderboard = query(collection(db, "leaderboard"), orderBy("score", "desc"), limit(10));
    onSnapshot(qLeaderboard, (querySnapshot) => {
      const listEl = document.getElementById('leaderboardList');
      listEl.innerHTML = '';
      let rank = 1;
      querySnapshot.forEach((doc) => {
        const data = doc.data();
        const li = document.createElement('li');
        li.className = 'leaderboard-item';
        li.innerHTML = `<span>#${rank} ${data.username}</span> <strong>${data.score} E</strong>`;
        listEl.appendChild(li);
        rank++;
      });
    });

    // Global Chat listener
    const qChat = query(collection(db, "global_chat"), orderBy("createdAt", "asc"), limit(50));
    onSnapshot(qChat, (querySnapshot) => {
      const chatMessages = document.getElementById('chatMessages');
      chatMessages.innerHTML = '';
      querySnapshot.forEach((doc) => {
        const msg = doc.data();
        const div = document.createElement('div');
        div.className = 'chat-msg';
        div.innerHTML = `<strong>${msg.username}:</strong> ${msg.text}`;
        chatMessages.appendChild(div);
      });
      chatMessages.scrollTop = chatMessages.scrollHeight;
    });

    window.sendChatMessage = async function(text) {
      const username = usernameInput.value || 'Anonymous';
      if (!text.trim()) return;
      try {
        await addDoc(collection(db, "global_chat"), {
          username: username,
          text: text,
          createdAt: serverTimestamp()
        });
      } catch (e) {
        console.error("Error sending message:", e);
      }
    };

    setInterval(() => {
      if (window.saveScoreToCloud) window.saveScoreToCloud();
    }, 5000);
  </script>
</head>
<body>

  <h1>E CLICKER</h1>

  <!-- ADMIN PANEL MODAL -->
  <div id="adminModal" class="modal-overlay">
    <div class="admin-dashboard-box">
      <div class="admin-dashboard-title">ADMIN PANEL:</div>
      <button class="dashboard-btn" id="infPointsBtn">Inf Points 🤑</button>
      <button class="dashboard-btn" id="givePointsBtn">Give Points to user 💸</button>
      <button class="dashboard-btn" id="setPointsBtn">Set Points 💰</button>
      <button class="dashboard-btn close-modal-btn" id="closeAdminModal">Close Panel</button>
    </div>
  </div>

  <!-- GLOBAL CHAT MODAL -->
  <div id="chatModal" class="modal-overlay">
    <div class="chat-box">
      <div class="panel-title" style="margin-top:0;">Global Chat 🌍</div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" class="chat-input" placeholder="Type a message..." maxlength="100">
        <button class="chat-send-btn" id="chatSendBtn">Send</button>
      </div>
      <button class="dashboard-btn close-modal-btn" id="closeChatModal" style="margin-top:10px; margin-bottom:0; padding:10px;">Close Chat</button>
    </div>
  </div>

  <div class="main-layout">
    <div class="game-section">
      <div class="stats-container">
        <div class="score-display"><span id="score">0</span> E</div>
        <div class="cps-display"><span id="cps">0</span> E / sec</div>
      </div>

      <div class="clicker-container" id="clickArea">
        <img 
          src="https://instasize.com/api/image/d552497648af7f20626f807e64481fd0c417fa28d6916753eab603d2c64328fc.jpeg" 
          alt="E Cat" 
          class="click-target" 
          id="catBtn"
        >
      </div>

      <!-- Button Row for ADMIN and Global chat -->
      <div class="button-row">
        <button class="admin-btn" id="adminBtn">ADMIN</button>
        <button class="global-chat-btn" id="globalChatBtn">Global<br>chat</button>
      </div>

      <div class="panel">
        <div class="panel-title">Upgrades</div>
        <button class="upgrade-btn" id="buyClicker" disabled>
          <div>
            <div>Update apk beggars</div>
            <small style="color:#aaa">+1 E per second</small>
          </div>
          <div><span id="costClicker">15</span> E</div>
        </button>

        <button class="upgrade-btn" id="buyPower" disabled>
          <div>
            <div>E Power Boost</div>
            <small style="color:#aaa">+1 per click</small>
          </div>
          <div><span id="costPower">50</span> E</div>
        </button>

        <button class="upgrade-btn" id="buyFactory" disabled>
          <div>
            <div>E Generator</div>
            <small style="color:#aaa">+10 E per second</small>
          </div>
          <div><span id="costFactory">500</span> E</div>
        </button>
      </div>
    </div>

    <!-- LEADERBOARD AT THE BOTTOM -->
    <div class="leaderboard-container">
      <div class="panel">
        <div class="panel-title">Global Leaderboard</div>
        <input type="text" id="usernameInput" class="username-input" placeholder="Type your name / Discord" maxlength="15">
        <ul class="leaderboard-list" id="leaderboardList">
          <li class="leaderboard-item"><span>Loading scores...</span></li>
        </ul>
      </div>
    </div>
  </div>

  <script>
    window.gameScore = parseFloat(localStorage.getItem('e_clicker_score')) || 0;
    let clickValue = parseInt(localStorage.getItem('e_clicker_clickValue')) || 1;
    let autoCps = parseInt(localStorage.getItem('e_clicker_autoCps')) || 0;

    let costClicker = parseInt(localStorage.getItem('e_clicker_costClicker')) || 15;
    let costPower = parseInt(localStorage.getItem('e_clicker_costPower')) || 50;
    let costFactory = parseInt(localStorage.getItem('e_clicker_costFactory')) || 500;

    const scoreEl = document.getElementById('score');
    const cpsEl = document.getElementById('cps');
    const catBtn = document.getElementById('catBtn');
    const clickArea = document.getElementById('clickArea');

    const buyClickerBtn = document.getElementById('buyClicker');
    const buyPowerBtn = document.getElementById('buyPower');
    const buyFactoryBtn = document.getElementById('buyFactory');
    
    // Modals & Controls
    const adminBtn = document.getElementById('adminBtn');
    const adminModal = document.getElementById('adminModal');
    const closeAdminModal = document.getElementById('closeAdminModal');
    const infPointsBtn = document.getElementById('infPointsBtn');
    const givePointsBtn = document.getElementById('givePointsBtn');
    const setPointsBtn = document.getElementById('setPointsBtn');

    const globalChatBtn = document.getElementById('globalChatBtn');
    const chatModal = document.getElementById('chatModal');
    const closeChatModal = document.getElementById('closeChatModal');
    const chatInput = document.getElementById('chatInput');
    const chatSendBtn = document.getElementById('chatSendBtn');

    // Admin Password Protection
    adminBtn.addEventListener('click', () => {
      const password = prompt("Enter ADMIN PASSWORD:");
      if (password === "admin123") {
        adminModal.style.display = "flex";
      } else if (password !== null) {
        alert("Incorrect password!");
      }
    });

    closeAdminModal.addEventListener('click', () => {
      adminModal.style.display = "none";
    });

    // Global Chat Modal Controls
    globalChatBtn.addEventListener('click', () => {
      chatModal.style.display = "flex";
    });

    closeChatModal.addEventListener('click', () => {
      chatModal.style.display = "none";
    });

    chatSendBtn.addEventListener('click', () => {
      window.sendChatMessage(chatInput.value);
      chatInput.value = '';
    });

    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        window.sendChatMessage(chatInput.value);
        chatInput.value = '';
      }
    });

    // Admin Dashboard Options
    infPointsBtn.addEventListener('click', () => {
      window.gameScore += 999999999;
      updateDisplay();
      saveProgressLocally();
      if(window.saveScoreToCloud) window.saveScoreToCloud();
      alert("Infinite Points Activated! 🤑");
    });

    givePointsBtn.addEventListener('click', () => {
      const amount = prompt("How many points do you want to add?");
      const num = parseFloat(amount);
      if (!isNaN(num)) {
        window.gameScore += num;
        updateDisplay();
        saveProgressLocally();
        if(window.saveScoreToCloud) window.saveScoreToCloud();
        alert(`Successfully added ${num} points! 💸`);
      } else if (amount !== null) {
        alert("Please enter a valid number.");
      }
    });

    setPointsBtn.addEventListener('click', () => {
      const amount = prompt("Set total score to what number?");
      const num = parseFloat(amount);
      if (!isNaN(num)) {
        window.gameScore = num;
        updateDisplay();
        saveProgressLocally();
        if(window.saveScoreToCloud) window.saveScoreToCloud();
        alert(`Score set to ${num}! 💰`);
      } else if (amount !== null) {
        alert("Please enter a valid number.");
      }
    });

    function saveProgressLocally() {
      localStorage.setItem('e_clicker_score', window.gameScore);
      localStorage.setItem('e_clicker_clickValue', clickValue);
      localStorage.setItem('e_clicker_autoCps', autoCps);
      localStorage.setItem('e_clicker_costClicker', costClicker);
      localStorage.setItem('e_clicker_costPower', costPower);
      localStorage.setItem('e_clicker_costFactory', costFactory);
    }

    catBtn.addEventListener('click', (e) => {
      window.gameScore += clickValue;
      updateDisplay();
      spawnFloatingText(e);
      saveProgressLocally();
    });

    function spawnFloatingText(event) {
      const float = document.createElement('div');
      float.className = 'float-text';
      float.innerText = `+${clickValue}`;
      const rect = clickArea.getBoundingClientRect();
      float.style.left = `${event.clientX - rect.left - 20}px`;
      float.style.top = `${event.clientY - rect.top - 20}px`;
      clickArea.appendChild(float);
      setTimeout(() => float.remove(), 800);
    }

    buyClickerBtn.addEventListener('click', () => {
      if (window.gameScore >= costClicker) {
        window.gameScore -= costClicker;
        autoCps += 1;
        costClicker = Math.floor(costClicker * 1.15);
        updateDisplay();
        saveProgressLocally();
      }
    });

    buyPowerBtn.addEventListener('click', () => {
      if (window.gameScore >= costPower) {
        window.gameScore -= costPower;
        clickValue += 1;
        costPower = Math.floor(costPower * 1.25);
        updateDisplay();
        saveProgressLocally();
      }
    });

    buyFactoryBtn.addEventListener('click', () => {
      if (window.gameScore >= costFactory) {
        window.gameScore -= costFactory;
        autoCps += 10;
        costFactory = Math.floor(costFactory * 1.2);
        updateDisplay();
        saveProgressLocally();
      }
    });

    setInterval(() => {
      window.gameScore += autoCps;
      updateDisplay();
      saveProgressLocally();
    }, 1000);

    function updateDisplay() {
      scoreEl.innerText = Math.floor(window.gameScore);
      cpsEl.innerText = autoCps;
      document.getElementById('costClicker').innerText = costClicker;
      document.getElementById('costPower').innerText = costPower;
      document.getElementById('costFactory').innerText = costFactory;

      buyClickerBtn.disabled = window.gameScore < costClicker;
      buyPowerBtn.disabled = window.gameScore < costPower;
      buyFactoryBtn.disabled = window.gameScore < costFactory;
    }

    updateDisplay();
  </script>
</body>
</html>
